<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mealie AI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="popup-logo" src="icons/icon-48.png" alt="" aria-hidden="true">
        <div>
          <h1>Mealie AI</h1>
          <p>חלץ את העמוד הנוכחי ושלח אותו ליצירת מתכון או מאמר.</p>
        </div>
      </header>

      <section class="settings">
        <label>
          כתובת Mealie
          <input id="mealieUrl" type="url" placeholder="http://localhost:3000">
        </label>

        <label>
          מה לחלץ
          <select id="extractMode">
            <option value="auto">זיהוי אוטומטי</option>
            <option value="recipe">חילוץ מתכון</option>
            <option value="article">חילוץ מאמר</option>
          </select>
        </label>

        <label>
          שפת תרגום
          <select id="translateLanguage"></select>
        </label>
      </section>

      <section class="options">
        <label class="checkbox-row">
          <input id="createShoppingList" type="checkbox">
          <span>צור גם רשימת קניות אוטומטית</span>
        </label>

        <label class="checkbox-row">
          <input id="organizeShoppingList" type="checkbox">
          <span>סדר את רשימת הקניות עם AI</span>
        </label>

        <label class="checkbox-row">
          <input id="includeAiTips" type="checkbox">
          <span>הוסף הערות, טיפים והמלצות סוגי רכיבים עם AI</span>
        </label>

        <label class="checkbox-row">
          <input id="includeItemImages" type="checkbox">
          <span>מצא ושמור גם תמונות לרכיבים, כלים ופריטי רשימת קניות</span>
        </label>
      </section>

      <section class="actions">
        <button id="extractOnly" class="secondary" type="button">רק חלץ</button>
        <button id="sendToMealie" class="primary" type="button">חלץ ושלח ל-AI</button>
      </section>
      <button id="connectMealie" class="connect-button" type="button" hidden>פתח/חבר את Mealie</button>

      <section id="previewPanel" class="preview-panel" hidden>
        <div class="preview-title">תצוגה מקדימה</div>
        <textarea id="previewText" readonly></textarea>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <a id="recipeLink" class="recipe-link" href="#" target="_blank" rel="noopener" hidden>פתח את המתכון ב-Mealie</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
