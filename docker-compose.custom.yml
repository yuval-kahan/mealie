services:
  mealie-custom:
    container_name: mealie-custom
    image: mealie-custom:dev
    build:
      context: .
      target: production
      dockerfile: ./docker/Dockerfile
      args:
        COMMIT: local-custom
    restart: unless-stopped
    ports:
      # The production image contains both the Nuxt frontend and the API.
      # Keep the local URL consistent with the development URL.
      - "3000:9000"
    volumes:
      - mealie-custom-data:/app/data/
    environment:
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: "DEBUG"
      DB_ENGINE: sqlite
      BASE_URL: http://localhost:3000
      TZ: Asia/Jerusalem

volumes:
  mealie-custom-data:
